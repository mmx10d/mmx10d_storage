<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        body {
            background: black;
            color: white;
        }
        .item{
            display: flex;
            justify-content: space-around;
        }
        #name {
            width: 100%;
            height: 100px;
            font-size: 150%;
            margin-bottom: 10px
        }
        #create_btn {
            width: 100%;
        }
        #add_btn {
            position: fixed:
            bottom: 0;
            margin: 0 auto;
            width: 100%
        }
        #item_div div {
            margin: 3px 0
        }
    </style>
    <meta charset="UTF-8">
    <title>Page title</title>
</head>
<body>
    <h1>ادارة التخزين</h1>
    <hr>
    <div id="item_div">
        <div class="item">لم تتلقى بيانات</div>
    </div>
    <button id="add_btn" onclick="add_div.style.display=''">انشاء</button>
    <div style="display:none" id="add_div">
        <h2>انشاء تخزين</h2>
        <label for="name">الاسم</label>
        <input autofocus type="text" id="name">
        <button id="create_btn">تم</button>
    </div>
</body>
<script>
    const domains = ["https://mmx10d_storage.onrender.com/",
    "http://localhost:8893/"]
    const website = domains[0];
    
    const item = document.querySelector(".class");
    const new_name = document.querySelector("#name")
    
    create_btn.onclick = ()=>{
        if(new_name.value == ""){
            model("ادخل اسم.");
            return
        };
        create(new_name.value);
        new_name.value =""
        add_div.style.display="none";
    }    
    function create(name){
        fetch(`${website}create?name=${name}`)
        .then(res=>{        
        get_items();
        })
        .catch(err=>{model("خطأ بالاتصال..")})
    }
    function del(name){
        fetch(`${website}delete?name=${name}`)
        .then(res=>get_items())
        .catch(err=>{model("خطأ بالاتصال..")})
    }
    function read(name){
        fetch(`${website}read?name=${name}`)
        .then(res=>res.text())
        .then(res=>model(res))
        .catch(err=>{model("خطأ بالاتصال..")})
    }
    function link(name){
        fetch(`${website}link?name=${name}`)
        .then(res => res.text())
        .then(res => {
            document.open();
            document.write(res);
            document.close();
        })
        .catch(err=>{model("خطأ بالاتصال..")})
    }
    function edit(name){
        fetch(`${website}edit?name=${name}`)
        .then(res => res.text())
        .then(res => {
        if(res.includes(`id="text"><`)){model("لايمكن تعديل ملف فارغ");return}     
            document.open();
            document.write(res)
            document.close();
        })
        .catch(err=>{model("خطأ بالاتصال..")})
    }
    function add_item(name){
        item_div.innerHTML += 
        `
            <div class="item">
                <span>${name}</span>
                <select>
                    <option value="none">اجراء..</option>
                    <option value="link">ربط</option>
                    <option value="read">قرائة</option>
                    <option value="edit">تعديل</option>
                    <option value="del">حذف</option>
                </select>
            </div>
        `;
        items_update();
    }
    function items_update(){
        const items = document.querySelectorAll(".item")
        for(let i = 0 ; i < items.length ; i++){
            const item = items[i];
            const item_select = item.querySelector("select");
            const file_name = item.querySelector("span")
            item_select.onchange=()=>{
                switch(item_select.value){
                    case 'link':
                        link(file_name.innerText);
                        break;
                    case 'read':
                        read(file_name.innerText);
                        break;
                    case 'edit':
                        edit(file_name.innerText);
                        break;
                    case 'del':
                        let ask = confirm(`هل تاكد حذف ${file_name.innerText} ؟`)
                        if(ask){
                            del(file_name.innerText);
                        }
                        break;
                    default:
                    model("لم تختر عملية")
                }
                item_select.value = "none"
            }
        }
    }
    function get_items(){
        fetch(`${website}get_files`)
        .then(res => res.json())        
        .then(res=>{
        item_div.innerHTML="";
            if(res.length < 1){
                item_div.innerHTML="لا يوجد عناصر"
            }
            else{
            for(let i = 0; i<res.length;i++){
                file = res[i];
                add_item(file);
            }}
        })
        .catch(err=>item_div.innerHTML="خطا بتلقي البيانات"+err)
    }
    function model(message, title="اشعار"){
        document.body.innerHTML += `
            <div id="xx1_model_cover"></div>
            <div id="xx1_model">
                <h2>${title}</h2>
                <p>${message}</p>
                <button>حسنا</button>
            </div>
        `;
        let xx1_model_cover = document.querySelector("#xx1_model_cover")
        let xx1_model = document.querySelector("#xx1_model");
        let xx1_model_title = xx1_model.querySelector("h2");
        let xx1_model_message = xx1_model.querySelector("p");
        let xx1_model_ok = xx1_model.querySelector("button");
        
        xx1_model_cover.style.cssText = `
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.4);
        position:absolute;
        left:0;
        top:0
        `;
        xx1_model.style.cssText = `
        width: 95vw;
        height: max-content;
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        border-radius: 15px;
        background: black;
        color: white;
        padding: 5px;
        display: flex;
        flex-direction: column;
        `;
        xx1_model_ok.onclick =()=>{
            xx1_model.remove();
            xx1_model_cover.remove();
        }
    }
    get_items();
</script>
</html>
